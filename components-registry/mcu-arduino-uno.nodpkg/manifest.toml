schema_version = 1

[compatibility]
engine_api = 1

[component]
id = "mcu-arduino-uno"
name = "Arduino Uno R3"
category = "Microcontroller"
author = "Nodus Community"
version = "1.0.0"
description = "ATmega328P 16 MHz development board with digital/PWM I/O, analog inputs, UART, and onboard L (D13) LED."

[electrical]
operating_voltage_min = 4.5
operating_voltage_max = 5.5

[mcu]
backend = "avr_atmega328p"

