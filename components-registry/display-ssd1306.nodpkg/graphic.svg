<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127 101.6">
  <title>SSD1306 OLED Display</title>
  <desc>0.96 inch 128x64 monochrome graphic OLED display with I2C header.</desc>
  <rect x="5" y="4" width="117" height="93.6" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="22.4" y="6" width="6" height="13.4" fill="#a1a1aa"/>
  <rect x="47.8" y="6" width="6" height="13.4" fill="#a1a1aa"/>
  <rect x="73.2" y="6" width="6" height="13.4" fill="#a1a1aa"/>
  <rect x="98.6" y="6" width="6" height="13.4" fill="#a1a1aa"/>
  <circle id="pin-gnd" cx="25.4" cy="12.7" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <circle id="pin-vcc" cx="50.8" cy="12.7" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <circle id="pin-scl" cx="76.2" cy="12.7" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <circle id="pin-sda" cx="101.6" cy="12.7" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <text x="25.4" y="24" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#94a3b8">GND</text>
  <text x="50.8" y="24" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#94a3b8">VCC</text>
  <text x="76.2" y="24" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#94a3b8">SCL</text>
  <text x="101.6" y="24" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#94a3b8">SDA</text>
  <rect x="11.5" y="28" width="104" height="64" rx="2" fill="#020617" stroke="#334155" stroke-width="1"/>
  <rect id="dyn-screen" x="15" y="32" width="97" height="56" rx="1" fill="#38bdf8" opacity="0.05"/>
  <text x="63.5" y="62" text-anchor="middle" font-family="monospace" font-size="8" fill="#e0f2fe">128 x 64 OLED</text>
