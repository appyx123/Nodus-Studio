<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 101.6 101.6">
  <title>DHT22 Sensor</title>
  <desc>DHT22 / AM2302 digital temperature and humidity sensor with 2.54 mm pin header.</desc>
  <rect x="6" y="6" width="89.6" height="66" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="14" y="14" width="73.6" height="42" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="20" y1="22" x2="81.6" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="20" y1="30" x2="81.6" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="20" y1="38" x2="81.6" y2="38" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="20" y1="46" x2="81.6" y2="46" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="9.7" y="72" width="6" height="16" fill="#a1a1aa"/>
  <rect x="35.1" y="72" width="6" height="16" fill="#a1a1aa"/>
  <rect x="60.5" y="72" width="6" height="16" fill="#a1a1aa"/>
  <rect x="85.9" y="72" width="6" height="16" fill="#a1a1aa"/>
  <circle id="dyn-activity" cx="82" cy="14" r="3.5" fill="#38bdf8" opacity="0.2"/>
  <circle id="pin-vcc" cx="12.7" cy="88.9" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <circle id="pin-data" cx="38.1" cy="88.9" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <circle id="pin-nc" cx="63.5" cy="88.9" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <circle id="pin-gnd" cx="88.9" cy="88.9" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <text x="12.7" y="99" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#64748b">VCC</text>
  <text x="38.1" y="99" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#64748b">DAT</text>
  <text x="63.5" y="99" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#64748b">NC</text>
  <text x="88.9" y="99" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#64748b">GND</text>
  <text x="50.8" y="64" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#475569">DHT22</text>
</svg>
