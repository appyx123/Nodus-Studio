<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76.2 76.2">
  <title>5V Power Source</title>
  <desc>Power supply block with 5V and GND pins 2.54 millimetres apart.</desc>
  <rect x="7.6" y="10" width="61" height="44" rx="4" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
  <rect x="22.4" y="54" width="6" height="14" rx="1.5" fill="#a1a1aa"/>
  <rect x="47.8" y="54" width="6" height="14" rx="1.5" fill="#a1a1aa"/>
  <text x="38.1" y="28" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f4f4f5">5V DC</text>
  <text x="25.4" y="46" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#f87171">+5V</text>
  <text x="50.8" y="46" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#a1a1aa">GND</text>
  <circle id="pin-vcc" cx="25.4" cy="63.5" r="4" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
  <circle id="pin-gnd" cx="50.8" cy="63.5" r="4" fill="#71717a" stroke="#27272a" stroke-width="1"/>
</svg>
