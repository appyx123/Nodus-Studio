  <rect x="2" y="44" width="6" height="14" rx="1.5" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
  <rect x="93.6" y="44" width="6" height="14" rx="1.5" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
  <circle cx="5" cy="51" r="2" fill="#0f172a"/>
  <circle cx="96.6" cy="51" r="2" fill="#0f172a"/>
  <circle cx="35" cy="51" r="14" fill="#0369a1"/>
  <g id="dyn-horn">
    <path d="M32 26 L38 26 L38 76 L32 76 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="35" cy="51" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="35" cy="30" r="1.5" fill="#64748b"/>
    <circle cx="35" cy="38" r="1.5" fill="#64748b"/>
    <circle cx="35" cy="64" r="1.5" fill="#64748b"/>
    <circle cx="35" cy="72" r="1.5" fill="#64748b"/>
    <circle cx="35" cy="51" r="3" fill="#94a3b8"/>
  </g>
  <text x="68" y="54" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#ffffff">SG90</text>
  <rect x="22.4" y="70" width="6" height="18.9" fill="#f59e0b"/>
  <rect x="47.8" y="70" width="6" height="18.9" fill="#ef4444"/>
  <rect x="73.2" y="70" width="6" height="18.9" fill="#78716c"/>
  <circle id="pin-pwm" cx="25.4" cy="88.9" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <circle id="pin-vcc" cx="50.8" cy="88.9" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <circle id="pin-gnd" cx="76.2" cy="88.9" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <text x="25.4" y="99" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#f59e0b">SIG</text>
  <text x="50.8" y="99" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#ef4444">VCC</text>
  <text x="76.2" y="99" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#78716c">GND</text>
</svg>
