<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76.2 76.2">
  <title>Pushbutton</title>
  <desc>Tactile pushbutton with input and output pins 2.54 millimetres apart.</desc>
  <rect x="10.2" y="8" width="55.8" height="46" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
  <rect x="22.4" y="54" width="6" height="14" rx="1.5" fill="#a1a1aa"/>
  <rect x="47.8" y="54" width="6" height="14" rx="1.5" fill="#a1a1aa"/>
  <circle cx="38.1" cy="31" r="14" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
  <circle id="dyn-cap" cx="38.1" cy="31" r="10" fill="#22c55e" opacity="0.35"/>
  <circle id="pin-in" cx="25.4" cy="63.5" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <circle id="pin-out" cx="50.8" cy="63.5" r="4" fill="#d4d4d8" stroke="#52525b" stroke-width="1"/>
  <text x="25.4" y="74" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#d4d4d8">IN</text>
  <text x="50.8" y="74" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#d4d4d8">OUT</text>
</svg>
