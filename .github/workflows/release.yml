name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux Portable Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build

      - name: Build release binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked

      - name: Package portable distribution
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          ./scripts/package-release.sh "${VERSION}"

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          gh release upload "${TAG}" dist-release/*.tar.gz dist-release/*.sha256 --clobber

  release-rpm:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            cargo \
            rust \
            nodejs \
            npm \
            webkit2gtk4.1-devel \
            gtk3-devel \
            openssl-devel \
            desktop-file-utils \
            libappstream-glib \
            tar \
            gh

      - name: Build RPM package
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          ./scripts/build-rpm.sh

      - name: Upload RPM artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          gh release upload "${TAG}" build-rpm/rpmbuild/RPMS/*/*.rpm build-rpm/rpmbuild/SRPMS/*.rpm --clobber
