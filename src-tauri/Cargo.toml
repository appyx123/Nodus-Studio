[package]
name = "nodus-studio"
version = "0.1.0"
description = "Nodus Studio desktop IoT workbench"
edition = "2021"
rust-version = "1.90"
default-run = "nodus"

[lib]
name = "nodus_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nodus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=0.8.2"
semver = "=1.0.28"
quick-xml = "=0.42.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
